<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まほうつかいの あんざん タイムアタック</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  .sub-title { text-align: center; font-size: 26px; font-weight: bold; margin: 0 0 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 18px; }
  .blue { background: #56a8f2; box-shadow: 0 6px 0 #2a78c0; }
  .all { background: linear-gradient(90deg, #ff5c8a, #f2a93b, #6fcf97, #56ccf2, #9b6cf0); box-shadow: 0 6px 0 #6b3fc0; }

  .ops { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 560px; margin: 0 auto; }
  .ops .all { grid-column: 1 / -1; }
  .ops button { font-size: 26px; }
  .levels-box { display: flex; flex-direction: column; gap: 14px; max-width: 420px; margin: 0 auto; }
  .levels-box .sub { font-size: 16px; }

  /* じょうほう */
  .status { display: flex; justify-content: center; gap: 16px; font-size: 22px; margin-bottom: 14px; }
  .status span { background: #fff; padding: 6px 18px; border-radius: 999px; }
  .timer { font-variant-numeric: tabular-nums; }

  /* もんだい */
  .problem {
    background: #fff;
    border: 4px solid #c9a6ff;
    border-radius: 24px;
    max-width: 640px;
    margin: 0 auto 16px;
    padding: 22px 12px;
    text-align: center;
    font-size: 46px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    min-height: 120px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .problem .count { font-size: 90px; color: #d6338a; }
  .problem .amari { font-size: 26px; }
  .box {
    display: inline-block;
    min-width: 2.2em;
    padding: 2px 8px;
    border: 4px solid #c9a6ff;
    border-radius: 14px;
    color: #2f80ed;
    background: #f8f4ff;
    cursor: pointer;
    min-height: 1.3em;
    line-height: 1.2;
  }
  .box.active { border-color: #9b6cf0; background: #fff; box-shadow: 0 0 0 4px rgba(155, 108, 240, 0.25); }
  .problem.ok .box { border-color: #6fcf97; background: #eafff2; }
  .problem.ng { animation: shake 0.35s; }
  .problem.ng .box { border-color: #ff8a8a; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* すうじボタン */
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; margin: 0 auto; }
  .keypad button { font-size: 30px; padding: 14px 0; background: #fff; color: #4a3b6b; box-shadow: 0 5px 0 #e2d1ff; border: 3px solid #c9a6ff; }
  .keypad .clear { background: #ffe3ea; color: #b8325f; font-size: 20px; }
  .keypad .enter { background: #6fcf97; color: #fff; border-color: #6fcf97; box-shadow: 0 5px 0 #3f9e67; font-size: 20px; }
  .keypad .to-amari { grid-column: 1 / -1; background: #56a8f2; color: #fff; border-color: #56a8f2; box-shadow: 0 5px 0 #2a78c0; font-size: 20px; }

  /* けっか */
  .result { text-align: center; font-size: 24px; line-height: 1.9; }
  .result .big { font-size: 52px; font-weight: bold; color: #d6338a; }
  .result .medal { font-size: 64px; line-height: 1.2; }
  .wrong-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
  .wrong-list div { background: #fff; border-radius: 14px; padding: 8px 14px; font-size: 20px; }

  /* スマートフォン */
  @media (max-width: 600px) {
    .sub-title { font-size: 20px; margin-bottom: 12px; }
    .ops { gap: 10px; }
    .ops button { font-size: 20px; }
    .levels-box { gap: 10px; }
    .status { font-size: 16px; gap: 10px; margin-bottom: 10px; }
    .status span { padding: 4px 12px; }
    .problem { font-size: 32px; padding: 14px 8px; min-height: 90px; border-width: 3px; gap: 6px; }
    .problem .count { font-size: 64px; }
    .problem .amari { font-size: 18px; }
    .box { border-width: 3px; border-radius: 10px; padding: 2px 6px; }
    .keypad { gap: 8px; }
    .keypad button { font-size: 24px; padding: 10px 0; }
    .keypad .clear, .keypad .enter, .keypad .to-amari { font-size: 16px; }
    .result { font-size: 18px; }
    .result .big { font-size: 38px; }
    .result .medal { font-size: 48px; }
    .wrong-list div { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="../../index.html">← メニューに もどる</a>
  <h1>⏱️ まほうつかいの あんざん タイムアタック</h1>

  <div class="wizard-box">
    <div class="wizard">🧙‍♀️</div>
    <div class="bubble" id="bubble"></div>
  </div>

  <!-- けいさんを えらぶ -->
  <div class="screen show" id="opScreen">
    <div class="ops">
      <button class="lv1" data-op="+">＋ たしざん</button>
      <button class="blue" data-op="-">− ひきざん</button>
      <button class="lv2" data-op="×">× かけざん</button>
      <button class="lv3" data-op="÷">÷ わりざん</button>
      <button class="all" data-op="mix">🌈 ぜんぶ まぜる</button>
    </div>
  </div>

  <!-- むずかしさを えらぶ -->
  <div class="screen" id="levelScreen">
    <div class="sub-title" id="opTitle"></div>
    <div class="levels-box" id="levelButtons"></div>
    <div class="row"><button class="purple" id="backToOps">← けいさんを えらぶ</button></div>
  </div>

  <!-- もんだい -->
  <div class="screen" id="quizScreen">
    <div class="status">
      <span>もんだい <b id="qno">1</b> / 10</span>
      <span class="timer">⏱️ <b id="time">0.0</b> びょう</span>
    </div>
    <div class="problem" id="problem"></div>
    <div class="keypad" id="keypad"></div>
  </div>

  <!-- けっか -->
  <div class="screen" id="endScreen">
    <div class="result">
      <div id="endTitle"></div>
      <div class="medal" id="medal"></div>
      <div class="big" id="endTime"></div>
      <div id="endMiss"></div>
      <div id="endBest"></div>
    </div>
    <div class="result" id="wrongTitle"></div>
    <div class="wrong-list" id="wrongList"></div>
    <div class="row">
      <button class="lv1" id="retry">もういちど</button>
      <button class="purple" id="change">えらびなおす</button>
    </div>
  </div>
</div>

<script src="../../common/fireworks.js"></script>
<script>
const QUESTIONS = 10;
const OP_NAMES = { "+": "＋ たしざん", "-": "− ひきざん", "×": "× かけざん", "÷": "÷ わりざん", mix: "🌈 ぜんぶ まぜる" };
const LEVELS = [
  { id: "easy", name: "かんたん", cls: "lv1", gold: 3, silver: 5 },
  { id: "normal", name: "ふつう", cls: "lv2", gold: 5, silver: 8 },
  { id: "hard", name: "むずかしい", cls: "lv3", gold: 8, silver: 12 },
];
const PRAISE = ["すごい！", "はやい！", "そのちょうし！", "まほうみたい！"];

const $ = (id) => document.getElementById(id);
const bubble = $("bubble");

let op = "+";
let level = LEVELS[0];
let problems = [];
let qIndex = 0;
let inputs = ["", ""];
let active = 0;
let mistakes = 0;
let wrongOnes = [];
let startTime = 0;
let timerId = null;
let playing = false;   // こたえを 入れられる ときだけ true
let gameToken = 0;     // とちゅうで やめたときに カウントダウンを とめる

function say(html) { bubble.innerHTML = html; }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("show"));
  $(id).classList.add("show");
}

// じこベスト（びょう。きろく できない ときも あそべる）
const bestKey = () => `anzan-best-${op}-${level.id}`;
function loadBest(key) {
  try { return Number(localStorage.getItem(key)) || 0; } catch (e) { return 0; }
}
function saveBest(key, sec) {
  try { localStorage.setItem(key, String(sec)); } catch (e) {}
}

// ---------- もんだいを つくる ----------
function makeProblem(o, lv) {
  let a, b;
  if (o === "+") {
    if (lv === "easy") { a = rand(1, 9); b = rand(1, 9); }
    else if (lv === "normal") { a = rand(10, 99); b = Math.random() < 0.5 ? rand(1, 9) : rand(10, 99); }
    else if (Math.random() < 0.5) {
      do { a = rand(10, 99); b = rand(10, 99); } while (a % 10 + b % 10 < 10); // くりあがり あり
    } else { a = rand(100, 999); b = rand(10, 99); }
    return { a, b, op: o, ans: a + b };
  }
  if (o === "-") {
    if (lv === "easy") { b = rand(1, 9); const c = rand(0, 9); a = b + c; }
    else if (lv === "normal") { a = rand(10, 99); b = Math.random() < 0.5 ? rand(1, 9) : rand(10, a); }
    else if (Math.random() < 0.5) {
      do { a = rand(20, 99); b = rand(10, a - 1); } while (a % 10 >= b % 10); // くりさがり あり
    } else { a = rand(100, 999); b = rand(10, 99); }
    return { a, b, op: o, ans: a - b };
  }
  if (o === "×") {
    if (lv === "easy") { a = rand(1, 9); b = rand(1, 9); }
    else if (lv === "normal") {
      const dan = Math.random() < 0.3 ? pick([0, 10]) : rand(1, 9);
      [a, b] = Math.random() < 0.5 ? [dan, rand(1, 9)] : [rand(1, 9), dan];
    } else { a = rand(11, 99); b = rand(2, 9); }
    return { a, b, op: o, ans: a * b };
  }
  // ÷
  b = rand(2, 9);
  let q, r;
  if (lv === "easy") { q = rand(1, 9); r = 0; }
  else if (lv === "normal") { q = rand(1, 9); r = Math.random() < 0.3 ? 0 : rand(1, b - 1); }
  else { q = rand(10, 19); r = Math.random() < 0.2 ? 0 : rand(1, b - 1); }
  return { a: b * q + r, b, op: o, ans: q, rem: r };
}

function makeProblems() {
  let ops;
  if (op === "mix") {
    const base = ["+", "-", "×", "÷", "+", "-", "×", "÷"];
    ops = shuffle([...base, ...shuffle(["+", "-", "×", "÷"]).slice(0, 2)]);
  } else {
    ops = Array(QUESTIONS).fill(op);
  }
  const seen = new Set();
  return ops.map((o) => {
    let p;
    let guard = 0;
    do { p = makeProblem(o, level.id); guard++; } while (seen.has(`${p.a}${p.op}${p.b}`) && guard < 100);
    seen.add(`${p.a}${p.op}${p.b}`);
    return p;
  });
}

const text = (p) => `${p.a} ${p.op === "-" ? "−" : p.op} ${p.b}`;
const answerText = (p) => (p.op === "÷" ? `${p.ans} あまり ${p.rem}` : `${p.ans}`);

// ---------- がめん ----------
function showOps() {
  stopGame();
  showScreen("opScreen");
  say("あんざんの まほうで タイムアタック！⏱️<br>どの けいさんに する？");
}

function showLevels(o) {
  op = o;
  $("opTitle").textContent = OP_NAMES[op];
  const box = $("levelButtons");
  box.innerHTML = "";
  LEVELS.forEach((lv) => {
    const best = loadBest(`anzan-best-${op}-${lv.id}`);
    const b = document.createElement("button");
    b.className = lv.cls;
    b.innerHTML = `${lv.name}<span class="sub">${best ? `じこベスト ${best.toFixed(1)}びょう` : "まだ きろく なし"}</span>`;
    b.addEventListener("click", () => { level = lv; startGame(); });
    box.appendChild(b);
  });
  showScreen("levelScreen");
  say("むずかしさを えらんでね！<br>10もん とけたら ゴールだよ🏁");
}

function startGame() {
  stopGame();
  const token = ++gameToken;
  problems = makeProblems();
  qIndex = 0;
  mistakes = 0;
  wrongOnes = [];
  $("qno").textContent = 1;
  $("time").textContent = "0.0";
  $("keypad").innerHTML = "";
  showScreen("quizScreen");
  say("よーい…");

  // 3・2・1・スタート！
  const steps = ["3", "2", "1", "スタート！"];
  steps.forEach((s, i) => {
    setTimeout(() => {
      if (token !== gameToken) return;
      $("problem").className = "problem";
      $("problem").innerHTML = `<span class="count">${s}</span>`;
    }, i * 700);
  });
  setTimeout(() => {
    if (token !== gameToken) return;
    startTime = performance.now();
    timerId = setInterval(() => { $("time").textContent = elapsed().toFixed(1); }, 100);
    playing = true;
    say("がんばって！🔥");
    showProblem();
  }, steps.length * 700);
}

function stopGame() {
  gameToken++;
  playing = false;
  clearInterval(timerId);
}

function elapsed() { return (performance.now() - startTime) / 1000; }

function showProblem() {
  const p = problems[qIndex];
  inputs = ["", ""];
  active = 0;
  $("qno").textContent = qIndex + 1;
  drawProblem();
  drawKeypad();
}

function drawProblem() {
  const p = problems[qIndex];
  const box = (i) => `<span class="box${active === i ? " active" : ""}" data-box="${i}">${inputs[i] || "&nbsp;"}</span>`;
  $("problem").className = "problem";
  $("problem").innerHTML = p.op === "÷"
    ? `<span>${text(p)} ＝</span>${box(0)}<span class="amari">あまり</span>${box(1)}`
    : `<span>${text(p)} ＝</span>${box(0)}`;
  $("problem").querySelectorAll(".box").forEach((b) =>
    b.addEventListener("click", () => { active = Number(b.dataset.box); drawProblem(); })
  );
}

function drawKeypad() {
  const pad = $("keypad");
  pad.innerHTML = "";
  const add = (label, cls, fn) => {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", fn);
    pad.appendChild(b);
  };
  [7, 8, 9, 4, 5, 6, 1, 2, 3].forEach((n) => add(String(n), "", () => typeDigit(n)));
  add("けす", "clear", backspace);
  add("0", "", () => typeDigit(0));
  add("こたえる", "enter", submit);
  if (problems[qIndex].op === "÷") add("あまりへ ▶", "to-amari", () => { active = 1; drawProblem(); });
}

function typeDigit(n) {
  if (!playing || inputs[active].length >= 4) return;
  inputs[active] = inputs[active] === "0" ? String(n) : inputs[active] + n;
  drawProblem();
}
function backspace() {
  if (!playing) return;
  if (inputs[active] === "" && active === 1) active = 0;
  else inputs[active] = inputs[active].slice(0, -1);
  drawProblem();
}
// Enter: わりざんで こたえを 入れた あとは あまりへ
function enterKey() {
  if (problems[qIndex].op === "÷" && active === 0 && inputs[0] !== "") { active = 1; drawProblem(); return; }
  submit();
}

function submit() {
  if (!playing || inputs[0] === "") return;
  const p = problems[qIndex];
  const ok = Number(inputs[0]) === p.ans && (p.op !== "÷" || Number(inputs[1] || 0) === p.rem);
  if (ok) {
    playing = false;
    $("problem").classList.add("ok");
    say(qIndex + 1 < problems.length ? pick(PRAISE) : "ゴール！🏁");
    setTimeout(() => {
      if (!$("quizScreen").classList.contains("show")) return;
      qIndex++;
      if (qIndex < problems.length) { playing = true; showProblem(); }
      else finish();
    }, 250);
  } else {
    mistakes++;
    if (!wrongOnes.includes(p)) wrongOnes.push(p);
    say("ちがうよ、もういちど！💪");
    inputs = ["", ""];
    active = 0;
    drawProblem();
    const el = $("problem");
    el.classList.remove("ng");
    void el.offsetWidth;
    el.classList.add("ng");
  }
}

function finish() {
  const sec = Math.round(elapsed() * 10) / 10;
  stopGame();
  const avg = sec / problems.length;
  const medal = avg <= level.gold ? "🥇" : avg <= level.silver ? "🥈" : "🥉";
  $("endTitle").textContent = `${OP_NAMES[op]}（${level.name}）`;
  $("medal").textContent = medal;
  $("endTime").textContent = `${sec.toFixed(1)} びょう`;
  $("endMiss").textContent = mistakes ? `まちがえた かず: ${mistakes}かい` : "まちがい なし！ 💯";

  const key = bestKey();
  const best = loadBest(key);
  if (!best || sec < best) {
    saveBest(key, sec);
    $("endBest").textContent = best ? `じこベスト こうしん！（まえは ${best.toFixed(1)}びょう）` : "はじめての きろく！";
    fireworks(best ? 8 : 4);
    say("じこベスト こうしん！🎉 はやい まほうだね！");
  } else {
    $("endBest").textContent = `じこベスト: ${best.toFixed(1)}びょう（あと ${(sec - best).toFixed(1)}びょう！）`;
    say(medal === "🥇" ? "きんメダル！🥇 すごい スピードだね！" : "おつかれさま！ もういちど ちょうせんする？");
  }

  $("wrongTitle").textContent = wrongOnes.length ? "まちがえた もんだい（こたえ）" : "";
  $("wrongList").innerHTML = wrongOnes.map((p) => `<div>${text(p)} ＝ <b>${answerText(p)}</b></div>`).join("");
  showScreen("endScreen");
}

// キーボード
window.addEventListener("keydown", (e) => {
  if (!$("quizScreen").classList.contains("show") || !playing) return;
  if (/^[0-9]$/.test(e.key)) typeDigit(Number(e.key));
  else if (e.key === "Backspace") backspace();
  else if (e.key === "Enter") { e.preventDefault(); enterKey(); }
});

document.querySelectorAll("[data-op]").forEach((b) => b.addEventListener("click", () => showLevels(b.dataset.op)));
$("backToOps").addEventListener("click", showOps);
$("retry").addEventListener("click", startGame);
$("change").addEventListener("click", () => showLevels(op));

showOps();
</script>
</body>
</html>
