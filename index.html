<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まほうの がっこう ゲームメニュー</title>
<link rel="stylesheet" href="common/style.css">
<style>
  .subject { margin-bottom: 28px; }
  .subject h2 {
    font-size: 26px;
    margin: 0 0 12px;
  }
  .games { display: flex; flex-wrap: wrap; gap: 16px; }
  .game {
    display: block;
    width: 260px;
    background: #fff;
    border: 4px solid #c9a6ff;
    border-radius: 20px;
    padding: 16px 20px;
    color: inherit;
    text-decoration: none;
    box-shadow: 0 6px 0 #e2d1ff;
    transition: transform 0.1s;
  }
  a.game:hover { transform: scale(1.04); }
  .game .icon { font-size: 44px; }
  .game .name { font-size: 22px; font-weight: bold; margin-top: 4px; }
  .game.soon { opacity: 0.55; border-style: dashed; box-shadow: none; }

  /* スマートフォン */
  @media (max-width: 600px) {
    .subject { margin-bottom: 20px; }
    .subject h2 { font-size: 21px; margin-bottom: 8px; }
    .games { gap: 10px; }
    .game { width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-width: 3px; }
    .game .icon { font-size: 34px; }
    .game .name { font-size: 18px; margin-top: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🏰 まほうの がっこう 🏰</h1>

  <div class="wizard-box">
    <div class="wizard">🧙‍♀️</div>
    <div class="bubble">ようこそ！きょうは どの ゲームで あそぶ？</div>
  </div>

  <section class="subject">
    <h2>📖 こくご</h2>
    <div class="games">
      <a class="game" href="kokugo/kanji-card/index.html">
        <div class="icon">🃏</div>
        <div class="name">かんじ カードめくり</div>
      </a>
    </div>
  </section>

  <section class="subject">
    <h2>🔢 さんすう</h2>
    <div class="games">
      <a class="game" href="sansu/anzan/index.html">
        <div class="icon">⏱️</div>
        <div class="name">あんざん タイムアタック</div>
      </a>
    </div>
  </section>

  <section class="subject">
    <h2>🌱 りか</h2>
    <div class="games">
      <a class="game" href="rika/quiz/index.html">
        <div class="icon">🔬</div>
        <div class="name">りかクイズ</div>
      </a>
    </div>
  </section>

  <section class="subject">
    <h2>🗾 しゃかい</h2>
    <div class="games"><div class="game soon"><div class="icon">❓</div><div class="name">じゅんびちゅう…</div></div></div>
  </section>

  <section class="subject">
    <h2>🔤 えいご</h2>
    <div class="games">
      <a class="game" href="eigo/kiite-erabu/index.html">
        <div class="icon">🔊</div>
        <div class="name">きいて えらぶ</div>
      </a>
      <a class="game" href="eigo/drill/index.html">
        <div class="icon">📒</div>
        <div class="name">ドリル もんだいしゅう</div>
      </a>
    </div>
  </section>

  <section class="subject">
    <h2>☕ きゅうけい（ぜんぶで 5ふん）</h2>
    <div class="games">
      <a class="game" href="kyuukei/hoshi-atsume/index.html">
        <div class="icon">⭐</div>
        <div class="name">ほしあつめ</div>
      </a>
      <a class="game" href="kyuukei/nazonazo/index.html">
        <div class="icon">❓</div>
        <div class="name">なぞなぞ</div>
      </a>
    </div>
  </section>
</div>
</body>
</html>
