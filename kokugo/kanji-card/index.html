<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まほうつかいの かんじ カードめくり</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  /* じょうほう */
  .status {
    display: flex;
    justify-content: center;
    gap: 30px;
    font-size: 22px;
    margin-bottom: 16px;
  }
  .status span { background: #fff; padding: 6px 18px; border-radius: 999px; }

  /* カード */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 640px;
    margin: 0 auto;
  }
  .card {
    aspect-ratio: 3 / 4;
    perspective: 800px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .card.open .card-inner, .card.done .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,0.12);
  }
  .back {
    background: repeating-linear-gradient(45deg, #9b6cf0 0 14px, #ad85f3 14px 28px);
    border: 4px solid #fff;
    font-size: 44px;
  }
  .front {
    background: #fff;
    border: 4px solid #c9a6ff;
    transform: rotateY(180deg);
    text-align: center;
    padding: 4px;
  }
  .front.kanji { font-size: 64px; font-weight: bold; color: #4a3b6b; }
  .front.yomi { font-size: 26px; font-weight: bold; color: #2f80ed; word-break: break-all; }
  .card.done .front {
    border-color: #ffd34d;
    background: #fffbe6;
    animation: sparkle 0.8s ease;
  }
  .card.done { cursor: default; }
  @keyframes sparkle {
    0% { box-shadow: 0 0 0 0 rgba(255, 211, 77, 0.9); }
    100% { box-shadow: 0 0 0 18px rgba(255, 211, 77, 0); }
  }
  .card.miss .front { border-color: #ff8a8a; animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }

  /* クリア */
  .result { text-align: center; font-size: 26px; line-height: 2; }
  .result .stars { font-size: 44px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 24px; }
  .review {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
  }
  .review div {
    background: #fff;
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 18px;
  }
  .review b { font-size: 28px; margin-right: 6px; }

  /* ひみつの 黒ねこ */
  .secret-cat {
    position: fixed;
    z-index: 10;
    display: none;
    pointer-events: none;
    text-align: center;
    transform: translate(-50%, -50%);
  }
  .secret-cat.show { display: block; animation: catJump 2.4s ease-in-out forwards; }
  .secret-cat .cat-face { font-size: 130px; line-height: 1; }
  .secret-cat .cat-talk {
    background: #3b2f4f;
    color: #fff;
    border-radius: 18px;
    padding: 8px 16px;
    font-size: 20px;
    white-space: nowrap;
    margin-bottom: 6px;
  }
  @keyframes catJump {
    0%   { transform: translate(-50%, -50%) scale(0.2); }
    25%  { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(0deg); }
    45%  { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(360deg); }
    75%  { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(360deg); }
    100% { transform: translate(calc(-50% + var(--dx) + 80vw), calc(-50% + var(--dy))) scale(1) rotate(360deg); }
  }

  /* スマートフォン */
  @media (max-width: 600px) {
    .status { gap: 10px; font-size: 16px; margin-bottom: 10px; }
    .status span { padding: 4px 12px; }
    .board { gap: 8px; }
    .card { aspect-ratio: 4 / 5; }
    .face { border-radius: 12px; }
    .back { font-size: 28px; border-width: 3px; }
    .front { border-width: 3px; }
    .front.kanji { font-size: 40px; }
    .front.yomi { font-size: 16px; }
    .result { font-size: 20px; }
    .result .stars { font-size: 30px; }
    .review b { font-size: 22px; }
    .secret-cat .cat-face { font-size: 90px; }
    .secret-cat .cat-talk { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="../../index.html">← メニューに もどる</a>
  <h1>🪄 まほうつかいの かんじ カードめくり 🪄</h1>

  <div class="wizard-box">
    <div class="wizard">🧙‍♀️</div>
    <div class="bubble" id="bubble"></div>
  </div>

  <!-- スタート画面 -->
  <div class="screen show" id="start">
    <div class="levels">
      <button class="lv1" data-level="1">かんたん<span class="sub">8まい・1年生のかんじ</span></button>
      <button class="lv2" data-level="2">ふつう<span class="sub">12まい・2年生のかんじ</span></button>
      <button class="lv3" data-level="3">むずかしい<span class="sub">16まい・3年生のかんじ</span></button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div class="screen" id="game">
    <div class="status">
      <span>めくったかいすう: <b id="tries">0</b></span>
      <span>⭐ <b id="stars">0</b></span>
    </div>
    <div class="board" id="board"></div>
    <div class="buttons">
      <button class="purple" id="quit">むずかしさを えらびなおす</button>
    </div>
  </div>

  <!-- クリア画面 -->
  <div class="screen" id="clear">
    <div class="result">
      <div>🎉 ぜんぶ そろったよ！ 🎉</div>
      <div>めくったかいすう: <b id="resultTries"></b>かい</div>
      <div class="stars" id="resultStars"></div>
    </div>
    <div class="result" id="catResult"></div>
    <div class="review" id="review"></div>
    <div class="buttons">
      <button class="purple" id="again">もういちど</button>
      <button class="lv2" id="change">むずかしさを かえる</button>
    </div>
  </div>
</div>

<div class="secret-cat" id="cat">
  <div class="cat-talk">にゃーん！みつかっちゃった！<br>ボーナス⭐を あげるにゃ</div>
  <div class="cat-face">🐈‍⬛</div>
</div>

<script src="../../common/fireworks.js"></script>

    { kanji: "坂", yomi: "さか", rei: "坂を のぼる" },
    { kanji: "島", yomi: "しま", rei: "海に うかぶ 島" },
    { kanji: "湖", yomi: "みずうみ", rei: "大きな 湖" },
    { kanji: "港", yomi: "みなと", rei: "港に 船が つく" },
    { kanji: "岸", yomi: "きし", rei: "川の 岸" },
    { kanji: "箱", yomi: "はこ", rei: "おもちゃ箱" },
    { kanji: "畑", yomi: "はたけ", rei: "畑で やさいを そだてる" },
    { kanji: "豆", yomi: "まめ", rei: "豆まき" },
    { kanji: "皿", yomi: "さら", rei: "お皿を ならべる" },
    { kanji: "笛", yomi: "ふえ", rei: "笛を ふく" },

    { kanji: "湯", yomi: "ゆ", rei: "お湯を わかす" },
    { kanji: "指", yomi: "ゆび", rei: "指で かぞえる" },
    { kanji: "根", yomi: "ね", rei: "木の 根っこ" },
    { kanji: "昔", yomi: "むかし", rei: "昔 むかし あるところに" },
    { kanji: "祭", yomi: "まつり", rei: "夏 祭り" },
    { kanji: "旅", yomi: "たび", rei: "旅に でる" },
    { kanji: "命", yomi: "いのち", rei: "命を たいせつに" },
  ],
};

const PAIRS = { 1: 4, 2: 6, 3: 8 };

const PRAISE = ["すごい！", "やったね！", "せいかい！", "まほうみたい！", "かんぺき！"];
const OSHII = [
  "おしい！もういちど まほうを かけてみよう🪄",
  "ちがったみたい。どこに あったか おぼえておこうね！",
  "だいじょうぶ！つぎは きっと見つかるよ✨",
];

const $ = (id) => document.getElementById(id);
const bubble = $("bubble");

let level = 1;
let words = [];      // こんかいの かんじ
let opened = [];     // いま めくっている カード
let locked = false;
let tries = 0;
let stars = 0;
let found = 0;
let quest = null;    // まほうつかいの もんだい
let catSeen = false; // ひみつの ねこに あえたか
const CAT_CHANCE = 0.08;

function say(html) { bubble.innerHTML = html; }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("show"));
  $(id).classList.add("show");
}

function home() {
  showScreen("start");
  say("ようこそ！<b>かんじの まほうがっこう</b>へ！🏰<br>むずかしさを えらんでね。");
}

function newQuest() {
  const left = words.filter((w) => !w.found);
  if (left.length === 0) { quest = null; return; }
  quest = pick(left);
  say(`もんだいだよ！<br><span class="big">「${quest.kanji}」</span> の よみかたの カードを さがしてね！<br>見つけたら ボーナス⭐だよ`);
}

function startGame(lv) {
  level = lv;
  words = shuffle(KANJI[level]).slice(0, PAIRS[level]).map((w, i) => ({ ...w, id: i, found: false }));
  opened = [];
  locked = false;
  tries = 0;
  stars = 0;
  found = 0;
  catSeen = false;
  $("tries").textContent = 0;
  $("stars").textContent = 0;

  const cards = [];
  words.forEach((w) => {
    cards.push({ id: w.id, type: "kanji", text: w.kanji });
    cards.push({ id: w.id, type: "yomi", text: w.yomi });
  });

  const board = $("board");
  board.innerHTML = "";
  shuffle(cards).forEach((c) => {
    const el = document.createElement("div");
    el.className = "card";
    el.dataset.id = c.id;
    el.innerHTML = `
      <div class="card-inner">
        <div class="face back">✨</div>
        <div class="face front ${c.type}">${c.text}</div>
      </div>`;
    el.addEventListener("click", () => flip(el));
    board.appendChild(el);
  });

  showScreen("game");
  newQuest();
}

function flip(el) {
  if (locked || el.classList.contains("open") || el.classList.contains("done")) return;
  el.classList.add("open");
  if (!catSeen && Math.random() < CAT_CHANCE) {
    showCat(el, () => afterOpen(el));
  } else {
    afterOpen(el);
  }
}

// カードから 黒ねこが とびだす
function showCat(el, done) {
  catSeen = true;
  locked = true;
  const cat = $("cat");
  const r = el.getBoundingClientRect();
  const x = r.left + r.width / 2;
  const y = r.top + r.height / 2;
  cat.style.left = x + "px";
  cat.style.top = y + "px";
  cat.style.setProperty("--dx", (window.innerWidth / 2 - x) + "px");
  cat.style.setProperty("--dy", (window.innerHeight / 2 - y) + "px");
  cat.classList.remove("show");
  void cat.offsetWidth; // アニメーションを さいしょから
  cat.classList.add("show");

  stars++;
  $("stars").textContent = stars;
  say("あっ！わたしの ねこ、こんなところに かくれてたのね！🐈‍⬛");

  setTimeout(() => {
    cat.classList.remove("show");
    if (!el.isConnected) return; // とちゅうで あたらしいゲームを はじめたとき
    locked = false;
    done();
  }, 2400);
}

function afterOpen(el) {
  opened.push(el);
  if (opened.length < 2) return;

  tries++;
  $("tries").textContent = tries;
  const [a, b] = opened;

  if (a.dataset.id === b.dataset.id) {
    const w = words[Number(a.dataset.id)];
    w.found = true;
    found++;
    a.classList.add("done");
    b.classList.add("done");
    opened = [];

    let bonus = "";
    stars++;
    if (quest && quest.id === w.id) {
      stars++;
      bonus = "<br>もんだいの かんじだ！ボーナス⭐ ゲット！";
    }
    $("stars").textContent = stars;

    fireworks(found === words.length ? 8 : 3);
    say(`${pick(PRAISE)} <span class="big">${w.kanji}（${w.yomi}）</span><br>「${w.rei}」の ${w.kanji} だよ✨${bonus}`);

    if (found === words.length) {
      locked = true;
      setTimeout(showClear, 2200);
    } else if (!quest || quest.id === w.id) {
      locked = true;
      setTimeout(() => { locked = false; newQuest(); }, 2200);
    }
  } else {
    locked = true;
    a.classList.add("miss");
    b.classList.add("miss");
    say(pick(OSHII) + (quest ? `<br>（もんだい: <b>「${quest.kanji}」</b>の よみかた）` : ""));
    setTimeout(() => {
      a.classList.remove("open", "miss");
      b.classList.remove("open", "miss");
      opened = [];
      locked = false;
    }, 1000);
  }
}

function showClear() {
  showScreen("clear");
  $("resultTries").textContent = tries;
  $("resultStars").textContent = "⭐".repeat(stars);
  $("catResult").textContent = catSeen ? "🐈‍⬛ ひみつの ねこに あえたね！" : "";
  $("review").innerHTML = words
    .map((w) => `<div><b>${w.kanji}</b>${w.yomi}</div>`)
    .join("");
  say("おめでとう！🎉 きみは <b>かんじの まほうつかい</b> だね！<br>きょう おぼえた かんじを みてみよう。");
}

document.querySelectorAll("[data-level]").forEach((btn) =>
  btn.addEventListener("click", () => startGame(Number(btn.dataset.level)))
);
$("again").addEventListener("click", () => startGame(level));
$("change").addEventListener("click", home);
$("quit").addEventListener("click", home);

home();
</script>
</body>
</html>
