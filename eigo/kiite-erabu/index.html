<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まほうつかいの えいご きいて えらぶ</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  .kinds { max-width: 760px; margin-left: auto; margin-right: auto; }
  .kinds button { min-width: 200px; }
  .all { background: linear-gradient(90deg, #ff5c8a, #f2a93b, #6fcf97, #56ccf2, #9b6cf0); box-shadow: 0 6px 0 #6b3fc0; }

  /* じょうほう */
  .status {
    display: flex;
    justify-content: center;
    gap: 30px;
    font-size: 22px;
    margin-bottom: 16px;
  }
  .status span { background: #fff; padding: 6px 18px; border-radius: 999px; }

  /* おとの ボタン */
  .sound-buttons { display: flex; justify-content: center; gap: 16px; margin-bottom: 20px; }
  .blue { background: #56a8f2; box-shadow: 0 6px 0 #2a78c0; }
  .green { background: #6fcf97; box-shadow: 0 6px 0 #3f9e67; }

  /* えらぶ カード */
  .choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 560px;
    margin: 0 auto;
  }
  .choice {
    background: #fff;
    color: #4a3b6b;
    border: 4px solid #c9a6ff;
    border-radius: 20px;
    padding: 14px 8px;
    box-shadow: 0 6px 0 #e2d1ff;
  }
  .choice .pic { font-size: 72px; line-height: 1.2; }
  .choice .pic.num { font-size: 64px; font-weight: bold; color: #8a4fd8; }
  .choice .ja { font-size: 20px; margin-top: 4px; }
  .choice .en { font-size: 22px; color: #2f80ed; min-height: 1.4em; }
  .choice.correct { border-color: #ffd34d; background: #fffbe6; box-shadow: 0 0 0 6px rgba(255, 211, 77, 0.6); }
  .choice.wrong { border-color: #ff8a8a; opacity: 0.6; }
  .choices.answered .choice { cursor: default; }
  .choices.answered .choice:hover { transform: none; }

  #next { display: block; margin: 24px auto 0; }

  /* おわり */
  .result { text-align: center; font-size: 26px; line-height: 2; }
  .result .stars { font-size: 40px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 24px; }
  .missed { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .missed button {
    background: #fff;
    color: #4a3b6b;
    font-size: 20px;
    padding: 10px 16px;
    box-shadow: 0 4px 0 #e2d1ff;
  }

  /* スマートフォン */
  @media (max-width: 600px) {
    .kinds button { min-width: 0; width: calc(50% - 6px); }
    .kinds .all { width: 100%; }
    .status { gap: 10px; font-size: 16px; margin-bottom: 10px; }
    .status span { padding: 4px 12px; }
    .sound-buttons { gap: 10px; margin-bottom: 14px; }
    .choices { gap: 10px; }
    .choice { padding: 10px 4px; border-width: 3px; border-radius: 16px; }
    .choice .pic { font-size: 48px; }
    .choice .pic.num { font-size: 44px; }
    .choice .ja { font-size: 15px; }
    .choice .en { font-size: 17px; }
    #next { margin-top: 16px; }
    .result { font-size: 20px; }
    .result .stars { font-size: 28px; }
    .missed button { font-size: 16px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="../../index.html">← メニューに もどる</a>
  <h1>🔤 まほうつかいの えいご きいて えらぶ 🔊</h1>

  <div class="wizard-box">
    <div class="wizard">🧙‍♀️</div>
    <div class="bubble" id="bubble"></div>
  </div>

  <!-- スタート画面 -->
  <div class="screen show" id="start">
    <div class="levels kinds">
      <button class="lv1" data-kind="animal">🐶 どうぶつ</button>
      <button class="lv2" data-kind="food">🍎 たべもの</button>
      <button class="lv3" data-kind="color">🎨 いろ</button>
      <button class="blue" data-kind="number">🔢 かず</button>
      <button class="purple" data-kind="greeting">👋 あいさつ</button>
      <button class="green" data-kind="action">🏃 うごき</button>
      <button class="all" data-kind="all">🌈 ぜんぶ まぜる</button>
    </div>
  </div>

  <!-- もんだい画面 -->
  <div class="screen" id="game">
    <div class="status">
      <span>もんだい <b id="qno">1</b> / <span id="qmax">10</span></span>
      <span>⭐ <b id="score">0</b></span>
    </div>
    <div class="sound-buttons">
      <button class="blue" id="again-sound">🔊 もういちど</button>
      <button class="green" id="slow-sound">🐢 ゆっくり</button>
    </div>
    <div class="choices" id="choices"></div>
    <button class="purple" id="next">つぎへ ▶</button>
  </div>

  <!-- おわり画面 -->
  <div class="screen" id="end">
    <div class="result">
      <div id="endTitle"></div>
      <div class="stars" id="endStars"></div>
    </div>
    <div class="result" id="missedTitle"></div>
    <div class="missed" id="missed"></div>
    <div class="buttons">
      <button class="purple" id="retry">もういちど</button>
      <button class="lv2" id="change">しゅるいを かえる</button>
    </div>
  </div>
</div>

<script src="../../common/fireworks.js"></script>
<script>
// ことばの データ（しゅるいごと）
const WORDS = {
  animal: [
    { en: "dog", ja: "いぬ", pic: "🐶" },
    { en: "cat", ja: "ねこ", pic: "🐱" },
    { en: "rabbit", ja: "うさぎ", pic: "🐰" },
    { en: "bird", ja: "とり", pic: "🐦" },
    { en: "fish", ja: "さかな", pic: "🐟" },
    { en: "bear", ja: "くま", pic: "🐻" },
    { en: "lion", ja: "ライオン", pic: "🦁" },
    { en: "monkey", ja: "さる", pic: "🐵" },
    { en: "elephant", ja: "ぞう", pic: "🐘" },
    { en: "pig", ja: "ぶた", pic: "🐷" },
    { en: "horse", ja: "うま", pic: "🐴" },
    { en: "panda", ja: "パンダ", pic: "🐼" },
  ],
  food: [
    { en: "apple", ja: "りんご", pic: "🍎" },
    { en: "banana", ja: "バナナ", pic: "🍌" },
    { en: "orange", ja: "オレンジ", pic: "🍊" },
    { en: "strawberry", ja: "いちご", pic: "🍓" },
    { en: "grapes", ja: "ぶどう", pic: "🍇" },
    { en: "cake", ja: "ケーキ", pic: "🍰" },
    { en: "bread", ja: "パン", pic: "🍞" },
    { en: "egg", ja: "たまご", pic: "🥚" },
    { en: "milk", ja: "ぎゅうにゅう", pic: "🥛" },
    { en: "ice cream", ja: "アイスクリーム", pic: "🍦" },
    { en: "pizza", ja: "ピザ", pic: "🍕" },
    { en: "rice", ja: "ごはん", pic: "🍚" },
  ],
  color: [
    { en: "red", ja: "あか", pic: "🔴" },
    { en: "blue", ja: "あお", pic: "🔵" },
    { en: "yellow", ja: "きいろ", pic: "🟡" },
    { en: "green", ja: "みどり", pic: "🟢" },
    { en: "pink", ja: "ピンク", pic: "🩷" },
    { en: "purple", ja: "むらさき", pic: "🟣" },
    { en: "orange", ja: "オレンジいろ", pic: "🟠" },
    { en: "black", ja: "くろ", pic: "⚫" },
    { en: "white", ja: "しろ", pic: "⚪" },
    { en: "brown", ja: "ちゃいろ", pic: "🟤" },
  ],
  number: [
    { en: "one", ja: "いち", pic: "1" },
    { en: "two", ja: "に", pic: "2" },
    { en: "three", ja: "さん", pic: "3" },
    { en: "four", ja: "よん", pic: "4" },
    { en: "five", ja: "ご", pic: "5" },
    { en: "six", ja: "ろく", pic: "6" },
    { en: "seven", ja: "なな", pic: "7" },
    { en: "eight", ja: "はち", pic: "8" },
    { en: "nine", ja: "きゅう", pic: "9" },
    { en: "ten", ja: "じゅう", pic: "10" },
  ],
  greeting: [
    { en: "hello", ja: "こんにちは", pic: "👋" },
    { en: "good morning", ja: "おはよう", pic: "🌅" },
    { en: "good night", ja: "おやすみ", pic: "🌙" },
    { en: "thank you", ja: "ありがとう", pic: "🙏" },
    { en: "sorry", ja: "ごめんね", pic: "🙇" },
    { en: "goodbye", ja: "さようなら", pic: "🚶‍♀️" },
    { en: "nice to meet you", ja: "はじめまして", pic: "🤝" },
    { en: "yes", ja: "はい", pic: "🙆‍♀️" },
    { en: "no", ja: "いいえ", pic: "🙅‍♀️" },
    { en: "please", ja: "おねがい", pic: "🥺" },
  ],
  action: [
    { en: "run", ja: "はしる", pic: "🏃" },
    { en: "walk", ja: "あるく", pic: "🚶" },
    { en: "swim", ja: "およぐ", pic: "🏊" },
    { en: "jump", ja: "とぶ", pic: "🦘" },
    { en: "eat", ja: "たべる", pic: "🍽️" },
    { en: "drink", ja: "のむ", pic: "🥤" },
    { en: "sleep", ja: "ねる", pic: "😴" },
    { en: "sing", ja: "うたう", pic: "🎤" },
    { en: "dance", ja: "おどる", pic: "💃" },
    { en: "read", ja: "よむ", pic: "📖" },
    { en: "write", ja: "かく", pic: "✏️" },
    { en: "cook", ja: "りょうりする", pic: "🍳" },
  ],
};
// どの しゅるいの ことばか おぼえておく（えらびしを おなじ しゅるいから 出すため）
Object.entries(WORDS).forEach(([kind, list]) => list.forEach((w) => (w.kind = kind)));

const QUESTIONS = 10;
const PRAISE = ["せいかい！", "すごい！", "やったね！", "まほうみたい！", "かんぺき！"];

const $ = (id) => document.getElementById(id);
const bubble = $("bubble");

let kind = "animal";
let questions = [];
let qIndex = 0;
let score = 0;
let missed = [];
let answered = false;

function say(html) { bubble.innerHTML = html; }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("show"));
  $(id).classList.add("show");
}

// えいごを よみあげる
let englishVoice = null;
// ききとりやすい 女の人の 声（うえから じゅんに さがす）
const NICE_VOICES = [
  "Ava", "Zoe", "Allison", "Susan", // Mac の きれいな 声（ダウンロードすると つかえる）
  "Samantha",                  // Mac
  "Google US English",         // Chrome
  "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira", // Windows
  "Flo", "Shelley", "Sandy", "Kathy", "Karen",
];
// おなじ 名前なら プレミアム → エンハンス（拡張）→ ふつう の じゅん
const QUALITY = ["Premium", "プレミアム", "Enhanced", "拡張"];
const quality = (v) => {
  const i = QUALITY.findIndex((q) => v.name.includes(q));
  return i === -1 ? 0 : QUALITY.length - i;
};
// おもしろ声（ききとりにくい）は つかわない
const FUNNY_VOICES = [
  "Albert", "Bad News", "Bahh", "Bells", "Boing", "Bubbles", "Cellos", "Wobble",
  "Good News", "Jester", "Organ", "Superstar", "Trinoids", "Whisper", "Zarvox",
];
function findVoice() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.replace("_", "-").startsWith("en"));
  for (const name of NICE_VOICES) {
    const found = voices.filter((v) => v.name.startsWith(name)).sort((a, b) => quality(b) - quality(a));
    if (found.length) { englishVoice = found[0]; return; }
  }
  const normal = voices.filter((v) => !FUNNY_VOICES.some((f) => v.name.startsWith(f)));
  englishVoice = normal.find((v) => v.lang.replace("_", "-") === "en-US") || normal[0] || null;
}
if ("speechSynthesis" in window) {
  findVoice();
  speechSynthesis.addEventListener("voiceschanged", findVoice);
}

function speak(text, rate = 0.95) {
  if (!("speechSynthesis" in window)) {
    say("あれ？ 音が でないみたい…🔇<br>パソコンの 音が 出るか、おうちの人に 見てもらってね。");
    return;
  }
  if (!englishVoice) findVoice();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text + "."); // 「.」で ことばの おわりが しぜんな ひびきに なる
  if (englishVoice) u.voice = englishVoice;
  u.lang = englishVoice ? englishVoice.lang : "en-US";
  u.rate = rate;
  speechSynthesis.speak(u);
}

function home() {
  speechSynthesis.cancel();
  showScreen("start");
  say("えいごの まほうを おぼえよう！🔤<br>どの ことばで あそぶ？");
}

function startGame(k) {
  kind = k;
  const pool = kind === "all" ? Object.values(WORDS).flat() : WORDS[kind];
  questions = shuffle(pool).slice(0, QUESTIONS);
  qIndex = 0;
  score = 0;
  missed = [];
  $("qmax").textContent = questions.length;
  $("score").textContent = 0;
  showScreen("game");
  showQuestion();
}

function picHtml(w) {
  return w.kind === "number"
    ? `<div class="pic num">${w.pic}</div>`
    : `<div class="pic">${w.pic}</div>`;
}

function showQuestion() {
  answered = false;
  const answer = questions[qIndex];
  $("qno").textContent = qIndex + 1;
  $("next").style.visibility = "hidden";

  // こたえ ＋ おなじ しゅるいから 3つ
  const others = shuffle(WORDS[answer.kind].filter((w) => w !== answer)).slice(0, 3);
  const box = $("choices");
  box.className = "choices";
  box.innerHTML = "";
  shuffle([answer, ...others]).forEach((w) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `${picHtml(w)}<div class="ja">${w.ja}</div><div class="en"></div>`;
    btn.addEventListener("click", () => choose(btn, w));
    btn.word = w;
    box.appendChild(btn);
  });

  say("よく きいてね！👂<br>きこえた えいごの 絵を えらんでね。");
  speak(answer.en);
}

function choose(btn, w) {
  if (answered) return;
  answered = true;
  const answer = questions[qIndex];
  const box = $("choices");
  box.classList.add("answered");

  // ぜんぶの カードに えいごを 出す
  box.querySelectorAll(".choice").forEach((b) => {
    b.querySelector(".en").textContent = b.word.en;
    if (b.word === answer) b.classList.add("correct");
  });

  if (w === answer) {
    score++;
    $("score").textContent = score;
    fireworks(2);
    say(`${pick(PRAISE)} <span class="big">${answer.en}</span> は 「${answer.ja}」 だよ✨`);
  } else {
    btn.classList.add("wrong");
    missed.push(answer);
    say(`おしい！ こたえは <span class="big">${answer.en}</span>（${answer.ja}）だよ。<br>もういちど きいてみよう🔊`);
  }
  speak(answer.en);

  $("next").textContent = qIndex + 1 < questions.length ? "つぎへ ▶" : "けっかを みる ▶";
  $("next").style.visibility = "visible";
}

function next() {
  qIndex++;
  if (qIndex < questions.length) {
    showQuestion();
  } else {
    showEnd();
  }
}

function showEnd() {
  showScreen("end");
  $("endTitle").textContent = `${questions.length}もん中 ${score}もん せいかい！`;
  $("endStars").textContent = "⭐".repeat(score);

  const list = $("missed");
  list.innerHTML = "";
  if (missed.length) {
    $("missedTitle").textContent = "まちがえた ことば（おすと きけるよ🔊）";
    missed.forEach((w) => {
      const b = document.createElement("button");
      b.innerHTML = `${w.pic} <b>${w.en}</b> ${w.ja}`;
      b.addEventListener("click", () => speak(w.en));
      list.appendChild(b);
    });
  } else {
    $("missedTitle").textContent = "";
  }

  if (score === questions.length) {
    fireworks(8);
    say("ぜんもん せいかい！🎉 きみは <b>えいごの まほうつかい</b> だね！");
  } else if (score >= questions.length / 2) {
    say("よく がんばったね！✨ まちがえた ことばを きいて おぼえよう。");
  } else {
    say("だいじょうぶ！なんども きくと おぼえられるよ😊<br>まちがえた ことばを おして きいてみよう。");
  }
}

document.querySelectorAll("[data-kind]").forEach((btn) =>
  btn.addEventListener("click", () => startGame(btn.dataset.kind))
);
$("again-sound").addEventListener("click", () => speak(questions[qIndex].en));
$("slow-sound").addEventListener("click", () => speak(questions[qIndex].en, 0.7));
$("next").addEventListener("click", next);
$("retry").addEventListener("click", () => startGame(kind));
$("change").addEventListener("click", home);

home();
</script>
</body>
</html>
